<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Моя карта Яндекс</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=5f79475c-6c30-45f6-b5ff-cd85e9d9c70e&lang=ru_RU&load=package.full" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        .controls { 
            position: absolute; 
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000; 
            background: white; 
            padding: 20px;
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); 
            min-width: 300px;
            max-width: 350px;
        }
        
        .controls h3 {
            margin: 0 0 15px 0;
            text-align: center;
            font-size: 15px;
        }
        
        .info { 
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .departure-item {
            font-size: 15px;
            color: #555;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <h3>Задачи на сегодня</h3>
        <div class="info">Всего: <span id="pointCount">0</span></div>
        <div id="departuresList"></div>
    </div>

    <script>
        var myMap;
        var markers = [];
        var API_URL = 'https://mapbot-api.onrender.com';
        var departures = {};

        ymaps.ready(init);

        function init() {
            loadDepartures();
            myMap = new ymaps.Map("map", {
                center: [54.7818, 32.0401],
                zoom: 12,
                controls: ['zoomControl', 'fullscreenControl']
            });
            loadPoints();
        }

        function loadDepartures() {
            var saved = localStorage.getItem('departures');
            if (saved) {
                try {
                    departures = JSON.parse(saved);
                } catch(e) {
                    departures = {};
                }
            }
            renderDeparturesList();
        }

        function saveDepartures() {
            localStorage.setItem('departures', JSON.stringify(departures));
        }

        function renderDeparturesList() {
            var container = document.getElementById('departuresList');
            if (!container) return;
            
            var html = '';
            for (var pointId in departures) {
                var pointTitle = departures[pointId].title;
                var name = departures[pointId].name;
                html += '<div class="departure-item">За ' + pointTitle + ' ым выехал ' + name + '</div>';
            }
            container.innerHTML = html;
        }

        function createIcon(color, emoji, taskNumber) {
            var svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="18" fill="${color}"/>
                    <text x="18" y="13" font-size="14" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
                    <text x="18" y="31" font-size="10" font-weight="bold" fill="white" text-anchor="middle">${taskNumber}</text>
                </svg>
            `;
            return {
                iconLayout: ymaps.templateLayoutFactory.createClass(
                    `<div style="width:36px; height:36px;">${svg}</div>`
                ),
                iconShape: {
                    type: 'Circle',
                    coordinates: [18, 18],
                    radius: 18
                }
            };
        }

        function getMarkerStyle(status) {
            if (status === 'active') return { color: '#ff3b30', emoji: '🛴' };
            if (status === 'not_found') return { color: '#333333', emoji: '🛴' };
            if (status === 'rented') return { color: '#8e8e93', emoji: '🛴' };
            return { color: '#ff3b30', emoji: '🛴' };
        }

        function loadPoints() {
            fetch(`${API_URL}/get_points`)
                .then(response => response.json())
                .then(data => {
                    markers.forEach(m => myMap.geoObjects.remove(m));
                    markers = [];
                    document.getElementById('pointCount').textContent = data.length;
                    
                    data.forEach((point) => {
                        var style = getMarkerStyle(point.status);
                        var taskNumber = point.title.trim(); 
                        
                        var iconOptions = createIcon(style.color, style.emoji, taskNumber);

                        var departureInfo = departures[point.id];
                        var departButtonHtml;
                        
                        if (departureInfo) {
                            departButtonHtml = `<button onclick="resetDeparture(${point.id})" style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px; margin-top: 10px;">Выехал ${departureInfo.name}</button>`;
                        } else {
                            var escapedTitle = point.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            departButtonHtml = `<button onclick="showChoiceMenu(${point.id}, '${escapedTitle}')" style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px; margin-top: 10px;">Выехать за ${point.title} ым</button>`;
                        }

                        var placemark = new ymaps.Placemark(
                            [point.lat, point.lon],
                            {
                                balloonContent: `
                                    <div style="min-width: 200px; padding: 12px; box-sizing: border-box;">
                                        <b style="font-size: 16px; display: block; text-align: center;">${point.title}</b>
                                        
                                        <div style="color: #555; font-size: 14px; margin: 8px 0; text-align: center;">
                                            ${point.address}
                                        </div>
                                        
                                        <small style="color: #999; display: block; text-align: center;">Статус: ${point.status}</small>
                                        
                                        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 10px;">
                                            <button onclick="updateStatus(${point.id}, 'found')" style="background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">
                                                Нашёл
                                            </button>
                                            <button onclick="updateStatus(${point.id}, 'not_found')" style="background: #212121; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">
                                                Не нашёл
                                            </button>
                                            <button onclick="updateStatus(${point.id}, 'rented')" style="background: #9E9E9E; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">
                                                Уехал в аренду
                                            </button>
                                        </div>
                                        
                                        ${departButtonHtml}
                                    </div>
                                `
                            },
                            iconOptions
                        );
                        
                        placemark.properties.set('pointData', point);
                        myMap.geoObjects.add(placemark);
                        markers.push(placemark);
                    });

                    if (data.length > 0) {
                        myMap.setBounds(myMap.geoObjects.getBounds(), { checkZoomRange: true, zoomMargin: 50 });
                    }
                })
                .catch(err => console.error("Ошибка загрузки точек:", err));
        }

        function updateStatus(pointId, status) {
            fetch(`${API_URL}/update_status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: pointId, status: status })
            }).then(response => response.json()).then(data => {
                if (data.success) {
                    if (status === 'found') {
                        delete departures[pointId];
                        saveDepartures();
                        renderDeparturesList();
                    }
                    loadPoints();
                }
            });
        }

        function showChoiceMenu(pointId, pointTitle) {
            var placemark = markers.find(m => {
                var data = m.properties.get('pointData');
                return data && data.id === pointId;
            });
            if (!placemark) return;
            
            var point = placemark.properties.get('pointData');
            var escapedTitle = pointTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            
            var newContent = `
                <div style="min-width: 200px; padding: 12px; box-sizing: border-box;">
                    <b style="font-size: 16px; display: block; text-align: center;">${point.title}</b>
                    <div style="color: #555; font-size: 14px; margin: 8px 0; text-align: center;">${point.address}</div>
                    <small style="color: #999; display: block; text-align: center;">Статус: ${point.status}</small>
                    
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 10px;">
                        <button onclick="updateStatus(${point.id}, 'found')" style="background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Нашёл</button>
                        <button onclick="updateStatus(${point.id}, 'not_found')" style="background: #212121; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Не нашёл</button>
                        <button onclick="updateStatus(${point.id}, 'rented')" style="background: #9E9E9E; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Уехал в аренду</button>
                    </div>
                    
                    <button disabled style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: not-allowed; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px; margin-top: 10px; opacity: 0.7;">Кто вы?</button>
                    
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 5px;">
                        <button onclick="selectName(${point.id}, '${escapedTitle}', 'Андрей')" style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Андрей</button>
                        <button onclick="selectName(${point.id}, '${escapedTitle}', 'Миша')" style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Миша</button>
                        <button onclick="selectName(${point.id}, '${escapedTitle}', 'Илья')" style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Илья</button>
                        <button onclick="selectName(${point.id}, '${escapedTitle}', 'Саша')" style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Саша</button>
                        <button onclick="showCustomInput(${point.id}, '${escapedTitle}')" style="background: #9E9E9E; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Ввести своё</button>
                    </div>
                </div>
            `;
            
            placemark.properties.set('balloonContent', newContent);
            placemark.balloon.open();
        }

        function showCustomInput(pointId, pointTitle) {
            var placemark = markers.find(m => {
                var data = m.properties.get('pointData');
                return data && data.id === pointId;
            });
            if (!placemark) return;
            
            var point = placemark.properties.get('pointData');
            var escapedTitle = pointTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            
            var newContent = `
                <div style="min-width: 200px; padding: 12px; box-sizing: border-box;">
                    <b style="font-size: 16px; display: block; text-align: center;">${point.title}</b>
                    <div style="color: #555; font-size: 14px; margin: 8px 0; text-align: center;">${point.address}</div>
                    <small style="color: #999; display: block; text-align: center;">Статус: ${point.status}</small>
                    
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 10px;">
                        <button onclick="updateStatus(${point.id}, 'found')" style="background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Нашёл</button>
                        <button onclick="updateStatus(${point.id}, 'not_found')" style="background: #212121; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Не нашёл</button>
                        <button onclick="updateStatus(${point.id}, 'rented')" style="background: #9E9E9E; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Уехал в аренду</button>
                    </div>
                    
                    <button disabled style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: not-allowed; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px; margin-top: 10px; opacity: 0.7;">Кто вы?</button>
                    
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 5px; width: 80%;">
                        <input type="text" id="customNameInput-${pointId}" placeholder="Введите имя" style="padding: 8px 12px; border: none; border-radius: 4px; font-size: 13px; width: 100%; box-sizing: border-box; color: white; background: #9E9E9E; text-align: center;" oninput="toggleOkButton(${pointId})">
                        <button id="okButton-${pointId}" onclick="confirmCustomName(${pointId}, '${escapedTitle}')" style="background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; padding: 8px 12px; display: none;">Ок</button>
                    </div>
                </div>
            `;
            
            placemark.properties.set('balloonContent', newContent);
            placemark.balloon.open();
            
            setTimeout(() => {
                var input = document.getElementById('customNameInput-' + pointId);
                if (input) input.focus();
            }, 100);
        }

        function toggleOkButton(pointId) {
            var input = document.getElementById('customNameInput-' + pointId);
            var okButton = document.getElementById('okButton-' + pointId);
            if (input && okButton) {
                okButton.style.display = input.value.trim() ? 'block' : 'none';
            }
        }

        function confirmCustomName(pointId, pointTitle) {
            var input = document.getElementById('customNameInput-' + pointId);
            if (input && input.value.trim()) {
                selectName(pointId, pointTitle, input.value.trim());
            }
        }

        function selectName(pointId, pointTitle, name) {
            departures[pointId] = {title: pointTitle, name: name};
            saveDepartures();
            renderDeparturesList();
            refreshBalloon(pointId);
        }

        function resetDeparture(pointId) {
            delete departures[pointId];
            saveDepartures();
            renderDeparturesList();
            refreshBalloon(pointId);
        }

        function refreshBalloon(pointId) {
            var placemark = markers.find(m => {
                var data = m.properties.get('pointData');
                return data && data.id === pointId;
            });
            if (!placemark) return;
            
            var point = placemark.properties.get('pointData');
            var departureInfo = departures[pointId];
            var departButtonHtml;
            
            if (departureInfo) {
                departButtonHtml = `<button onclick="resetDeparture(${point.id})" style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px; margin-top: 10px;">Выехал ${departureInfo.name}</button>`;
            } else {
                var escapedTitle = point.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                departButtonHtml = `<button onclick="showChoiceMenu(${point.id}, '${escapedTitle}')" style="background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px; margin-top: 10px;">Выехать за ${point.title} ым</button>`;
            }
            
            var newContent = `
                <div style="min-width: 200px; padding: 12px; box-sizing: border-box;">
                    <b style="font-size: 16px; display: block; text-align: center;">${point.title}</b>
                    <div style="color: #555; font-size: 14px; margin: 8px 0; text-align: center;">${point.address}</div>
                    <small style="color: #999; display: block; text-align: center;">Статус: ${point.status}</small>
                    
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 10px;">
                        <button onclick="updateStatus(${point.id}, 'found')" style="background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Нашёл</button>
                        <button onclick="updateStatus(${point.id}, 'not_found')" style="background: #212121; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Не нашёл</button>
                        <button onclick="updateStatus(${point.id}, 'rented')" style="background: #9E9E9E; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 80%; text-align: center; padding: 8px 12px;">Уехал в аренду</button>
                    </div>
                    
                    ${departButtonHtml}
                </div>
            `;
            
            placemark.properties.set('balloonContent', newContent);
            placemark.balloon.open();
        }
    </script>
</body>
</html>
