<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Моя карта Яндекс v3</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=5f79475c-6c30-45f6-b5ff-cd85e9d9c70e&lang=ru_RU&load=package.full" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .controls { 
            position: absolute; 
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000; 
            background: white; 
            padding: 10px;
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); 
            min-width: 200px;
            max-width: 250px;
        }
        .controls h3 { margin: 0 0 8px 0; text-align: center; font-size: 13px; }
        .info { font-size: 11px; color: #666; text-align: center; margin-bottom: 8px; }
        button { 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: bold;
            margin-top: 5px; 
            width: 100%; 
        }
        .btn-route { background: #4CAF50; }
        .btn-route:hover { background: #45a049; }
        .btn-clear { background: #f44336; }
        .btn-clear:hover { background: #da190b; }
        .status-buttons { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
        .status-btn { padding: 5px 8px; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; color: white; }
        .btn-found { background: #4CAF50; }
        .btn-not-found { background: #212121; }
        .btn-rented { background: #9E9E9E; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <h3>Задачи на сегодня</h3>
        <div class="info">Всего: <span id="pointCount">0</span></div>
        <button class="btn-route" onclick="buildRoute()">Построить маршрут</button>
        <button class="btn-clear" onclick="clearRoute()">Очистить</button>
    </div>

    <script>
        var myMap;
        var markers = [];
        var routeControl = null;
        var API_URL = 'https://mapbot-api.onrender.com';

        ymaps.ready(init);

        function init() {
            myMap = new ymaps.Map("map", {
                center: [54.7818, 32.0401],
                zoom: 12,
                controls: ['zoomControl', 'fullscreenControl']
            });
            loadPoints();
        }

        // Создаем SVG-иконку с эмодзи и номером
        function createIcon(color, emoji, num) {
            var svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 42 42">
                    <circle cx="21" cy="21" r="19" fill="${color}" stroke="white" stroke-width="2"/>
                    <text x="21" y="18" font-size="16" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
                    <text x="21" y="32" font-size="11" font-weight="bold" fill="white" text-anchor="middle">${num}</text>
                </svg>
            `;
            return {
                iconLayout: ymaps.templateLayoutFactory.createClass(
                    `<div style="width:42px; height:42px;">${svg}</div>`
                ),
                iconShape: {
                    type: 'Circle',
                    coordinates: [21, 21],
                    radius: 21
                }
            };
        }

        function getMarkerStyle(status) {
            if (status === 'active') return { color: '#ff3b30', emoji: '🛴' };
            if (status === 'not_found') return { color: '#333333', emoji: '🛴' };
            if (status === 'rented') return { color: '#8e8e93', emoji: '🛴' };
            return { color: '#ff3b30', emoji: '🛴' };
        }

        function loadPoints() {
            fetch(`${API_URL}/get_points`)
                .then(response => response.json())
                .then(data => {
                    markers.forEach(m => myMap.geoObjects.remove(m));
                    markers = [];
                    document.getElementById('pointCount').textContent = data.length;
                    
                    data.forEach((point, index) => {
                        var style = getMarkerStyle(point.status);
                        var num = index + 1;
                        var iconOptions = createIcon(style.color, style.emoji, num);

                        var placemark = new ymaps.Placemark(
                            [point.lat, point.lon],
                            {
                                balloonContent: `
                                    <div style="min-width: 200px; padding: 10px;">
                                        <b style="font-size: 16px;">№${num}. ${point.title}</b><br>
                                        <small style="color: #666;">${point.address}</small><br>
                                        <small style="color: #999;">Статус: ${point.status}</small>
                                        <div class="status-buttons">
                                            <button class="status-btn btn-found" onclick="updateStatus(${point.id}, 'found')">✓ Нашёл</button>
                                            <button class="status-btn btn-not-found" onclick="updateStatus(${point.id}, 'not_found')">✗ Не нашёл</button>
                                            <button class="status-btn btn-rented" onclick="updateStatus(${point.id}, 'rented')">🏠 Уехал в аренду</button>
                                        </div>
                                    </div>
                                `
                            },
                            iconOptions
                        );
                        
                        placemark.properties.set('pointData', point);
                        myMap.geoObjects.add(placemark);
                        markers.push(placemark);
                    });

                    if (data.length > 0) {
                        myMap.setBounds(myMap.geoObjects.getBounds(), { checkZoomRange: true, zoomMargin: 50 });
                    }
                })
                .catch(err => console.error("Ошибка загрузки точек:", err));
        }

        function updateStatus(pointId, status) {
            fetch(`${API_URL}/update_status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: pointId, status: status })
            }).then(response => response.json()).then(data => {
                if (data.success) loadPoints();
            });
        }

        function buildRoute() {
            var activeMarkers = markers.filter(function(m) {
                var data = m.properties.get('pointData');
                return data && data.status === 'active';
            });

            if (activeMarkers.length < 2) { 
                alert('Нужно минимум 2 активных (красных) точки для построения маршрута!'); 
                return; 
            }
            
            if (routeControl) {
                myMap.geoObjects.remove(routeControl);
            }
            
            var waypoints = activeMarkers.map(function(m) {
                return m.geometry.getCoordinates();
            });
            
            routeControl = new ymaps.multiRouter.MultiRoute({
                referencePoints: waypoints,
                params: { routingMode: 'auto' }
            }, { 
                boundsAutoApply: true,
                routeActiveStrokeColor: "2a8fbd",
                routeActiveStrokeWidth: 4
            });
            
            myMap.geoObjects.add(routeControl);
        }

        function clearRoute() {
            if (routeControl) { 
                myMap.geoObjects.remove(routeControl); 
                routeControl = null; 
            }
        }
    </script>
</body>
</html>
